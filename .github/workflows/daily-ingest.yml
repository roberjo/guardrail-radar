name: daily-ingest

on:
  schedule:
    - cron: '0 12 * * *' # adjust to preferred UTC time
  workflow_dispatch: {}

jobs:
  connector:
    strategy:
      fail-fast: false
      # reddit deferred: Reddit blocks script-app creation for this account
      # and network-level 403s its unauthenticated .json endpoints from both
      # this sandbox's IP and GitHub Actions runner IPs (confirmed via a
      # live probe, not assumed) — see CHANGELOG.md. connectors/reddit.py
      # and its tests are untouched; re-add "reddit" here once a working
      # credential path exists.
      matrix:
        source: [hn, github, lobsters, producthunt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m connectors.${{ matrix.source }}
        env:
          # REDDIT_CLIENT_ID/SECRET intentionally omitted — reddit isn't in
          # the matrix above right now. Add both back here when it is.
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          # Name must equal matrix.source (not prefixed) — download-artifact
          # extracts each artifact into path/<artifact-name>/, so this is
          # what makes it land at data/raw/<source>/ below.
          name: ${{ matrix.source }}
          path: data/raw/${{ matrix.source }}/

  commit:
    needs: connector
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only unless a job declares otherwise —
    # confirmed by an actual failed run: git-auto-commit-action built the
    # commit locally then got a 403 pushing it. contents:write is scoped to
    # just this job; the connector matrix above never needs to write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: daily ingest ${{ github.run_id }}'
          file_pattern: 'data/raw/**'
