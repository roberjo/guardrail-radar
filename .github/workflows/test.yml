name: test

# Runs the unit suite on every push — see docs/technical-spec.md §18.
# Deliberately separate from the scheduled ingest/publish workflows.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check connectors pipeline tests
      - run: mypy connectors pipeline
      - run: pytest -q
